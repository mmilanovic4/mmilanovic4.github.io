<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 298" width="760" height="298" role="img" aria-label="On a Mac the menu bar sits on the edge of the screen, which stops the pointer on it; a menu bar inside a window is a thin strip the pointer flies past unless the hand stops it">
  <style>
    .mbw text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mbw-title { font-size: 17px; font-weight: 600; fill: #24292f; }
    .mbw-sub { font-size: 13px; fill: #57606a; }
    .mbw-label { font-size: 13px; font-weight: 600; fill: #0a3069; }
    .mbw-note { font-size: 13px; fill: #bf3989; }
    .mbw-desk { fill: #f6f8fa; }
    .mbw-screen { fill: none; stroke: #8c959f; stroke-width: 2; }
    .mbw-window { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
    .mbw-menu { fill: #ddf4ff; }
    .mbw-menu-edge { stroke: #0969da; stroke-width: 1; }
    .mbw-rule { stroke: #d0d7de; stroke-width: 1; }
    .mbw-dot { fill: #d0d7de; }
    .mbw-glyph { stroke: #8c959f; stroke-width: 1.2; fill: none; }
    .mbw-path { stroke: #bf3989; stroke-width: 2; fill: none; stroke-dasharray: 4 4; }
    .mbw-head { fill: #bf3989; }
    .mbw-divider { stroke: #d0d7de; stroke-width: 1; }
  </style>

  <defs>
    <clipPath id="mbw-clip-mac">
      <rect x="40" y="64" width="300" height="184" rx="6"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="760" height="298" fill="#ffffff"/>

  <g class="mbw">
    <text class="mbw-title" x="40" y="44">Mac</text>

    <rect class="mbw-desk" x="40" y="64" width="300" height="184" rx="6"/>
    <rect class="mbw-menu" x="40" y="64" width="300" height="24" clip-path="url(#mbw-clip-mac)"/>
    <line class="mbw-menu-edge" x1="40" y1="88" x2="340" y2="88"/>
    <text class="mbw-label" x="56" y="76" dominant-baseline="central">menu bar</text>

    <rect class="mbw-window" x="80" y="120" width="220" height="110" rx="6"/>
    <line class="mbw-rule" x1="80" y1="142" x2="300" y2="142"/>
    <circle class="mbw-dot" cx="96" cy="131" r="4"/>
    <circle class="mbw-dot" cx="110" cy="131" r="4"/>
    <circle class="mbw-dot" cx="124" cy="131" r="4"/>

    <circle class="mbw-head" cx="190" cy="202" r="3.5"/>
    <path class="mbw-path" d="M190,196 V80"/>
    <path class="mbw-head" d="M190,66 L184,78 L196,78 Z"/>
    <text class="mbw-note" x="202" y="76" dominant-baseline="central">stops at the edge</text>

    <rect class="mbw-screen" x="40" y="64" width="300" height="184" rx="6"/>

    <text class="mbw-sub" x="190" y="280" text-anchor="middle">the screen edge does the stopping</text>

    <line class="mbw-divider" x1="380" y1="40" x2="380" y2="258"/>

    <text class="mbw-title" x="420" y="44">Windows</text>

    <rect class="mbw-desk" x="420" y="64" width="300" height="184" rx="6"/>

    <rect class="mbw-window" x="460" y="104" width="220" height="126" rx="6"/>
    <rect class="mbw-menu" x="461" y="126" width="218" height="22"/>
    <line class="mbw-menu-edge" x1="460" y1="126" x2="680" y2="126"/>
    <line class="mbw-menu-edge" x1="460" y1="148" x2="680" y2="148"/>
    <text class="mbw-label" x="476" y="137" dominant-baseline="central">menu bar</text>
    <line class="mbw-glyph" x1="628" y1="119" x2="636" y2="119"/>
    <rect class="mbw-glyph" x="644" y="111" width="8" height="8"/>
    <line class="mbw-glyph" x1="660" y1="111" x2="668" y2="119"/>
    <line class="mbw-glyph" x1="668" y1="111" x2="660" y2="119"/>

    <circle class="mbw-head" cx="570" cy="202" r="3.5"/>
    <path class="mbw-path" d="M570,196 V86"/>
    <path class="mbw-head" d="M570,72 L564,84 L576,84 Z"/>
    <text class="mbw-note" x="582" y="80" dominant-baseline="central">flies past the menu</text>

    <rect class="mbw-screen" x="420" y="64" width="300" height="184" rx="6"/>

    <text class="mbw-sub" x="570" y="280" text-anchor="middle">the hand does the stopping</text>
  </g>
</svg>
