<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="The server ships an empty HTML shell and a JavaScript bundle, the browser renders the component tree, and an API supplies data only">
  <style>
    .cp text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .cp-title { font-size: 17px; font-weight: 600; fill: #24292f; }
    .cp-sub { font-size: 13px; fill: #57606a; }
    .cp-node-title { font-size: 13px; font-weight: 600; }
    .cp-node-sub { font-size: 12px; }
    .cp-label { font-size: 12px; fill: #57606a; }
    .cp-chip { font-size: 12px; fill: #0a3069; }
    .cp-edge { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .cp-edge-dash { stroke: #8c959f; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
  </style>

  <defs>
    <marker id="cp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="280" fill="#ffffff"/>

  <g class="cp">
    <text class="cp-title" x="30" y="44">everything is a component</text>
    <text class="cp-sub" x="30" y="66">the server ships a shell, the browser renders the tree</text>

    <rect x="30" y="126" width="140" height="60" rx="8" fill="#faf5ff" stroke="#8250df" stroke-width="1"/>
    <text class="cp-node-title" x="100" y="146" text-anchor="middle" dominant-baseline="central" fill="#4c2889">CDN / server</text>
    <text class="cp-node-sub" x="100" y="166" text-anchor="middle" dominant-baseline="central" fill="#6639ba">HTML + JS bundle</text>

    <line class="cp-edge" x1="172" y1="156" x2="228" y2="156" marker-end="url(#cp-arrow)"/>

    <rect x="230" y="96" width="300" height="120" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
    <text class="cp-node-title" x="380" y="116" text-anchor="middle" dominant-baseline="central" fill="#0a3069">browser</text>

    <rect x="246" y="130" width="268" height="72" rx="6" fill="none" stroke="#54aeff" stroke-width="1" stroke-dasharray="4 4"/>
    <text class="cp-node-sub" x="380" y="146" text-anchor="middle" dominant-baseline="central" fill="#185fa5">JS renders the component tree</text>

    <rect x="256" y="162" width="76" height="32" rx="6" fill="#ffffff" stroke="#54aeff" stroke-width="1"/>
    <text class="cp-chip" x="294" y="178" text-anchor="middle" dominant-baseline="central">Header</text>

    <rect x="342" y="162" width="76" height="32" rx="6" fill="#ffffff" stroke="#54aeff" stroke-width="1"/>
    <text class="cp-chip" x="380" y="178" text-anchor="middle" dominant-baseline="central">Main</text>

    <rect x="428" y="162" width="76" height="32" rx="6" fill="#ffffff" stroke="#54aeff" stroke-width="1"/>
    <text class="cp-chip" x="466" y="178" text-anchor="middle" dominant-baseline="central">Footer</text>

    <text class="cp-label" x="557" y="128" text-anchor="middle">fetch</text>
    <line class="cp-edge-dash" x1="532" y1="142" x2="583" y2="142" marker-end="url(#cp-arrow)"/>

    <line class="cp-edge" x1="585" y1="176" x2="534" y2="176" marker-end="url(#cp-arrow)"/>
    <text class="cp-label" x="557" y="194" text-anchor="middle">JSON</text>

    <rect x="585" y="126" width="145" height="60" rx="8" fill="#ffeff7" stroke="#bf3989" stroke-width="1"/>
    <text class="cp-node-title" x="657" y="146" text-anchor="middle" dominant-baseline="central" fill="#772057">API</text>
    <text class="cp-node-sub" x="657" y="166" text-anchor="middle" dominant-baseline="central" fill="#99286e">data only, no HTML</text>

    <text class="cp-sub" x="380" y="252" text-anchor="middle">the server stops rendering pages and starts serving data</text>
  </g>
</svg>
