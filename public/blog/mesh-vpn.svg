<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="760" height="318" role="img" aria-label="In a hub and spoke VPN every device connects to one central server and all traffic passes through it; in a mesh every device holds a direct tunnel to every other device">
  <style>
    .mv text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mv-title { font-size: 17px; font-weight: 600; fill: #24292f; }
    .mv-sub { font-size: 13px; fill: #57606a; }
    .mv-node { font-size: 13px; font-weight: 600; }
    .mv-link { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .mv-divider { stroke: #d0d7de; stroke-width: 1; }
  </style>

  <rect x="0" y="0" width="760" height="318" fill="#ffffff"/>

  <g class="mv">
    <text class="mv-title" x="30" y="44">hub and spoke</text>

    <line class="mv-link" x1="88" y1="100" x2="190" y2="180"/>
    <line class="mv-link" x1="292" y1="100" x2="190" y2="180"/>
    <line class="mv-link" x1="190" y1="260" x2="190" y2="180"/>

    <rect x="44" y="82" width="88" height="36" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
    <text class="mv-node" x="88" y="100" text-anchor="middle" dominant-baseline="central" fill="#0a3069">laptop</text>

    <rect x="248" y="82" width="88" height="36" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
    <text class="mv-node" x="292" y="100" text-anchor="middle" dominant-baseline="central" fill="#0a3069">phone</text>

    <rect x="132" y="160" width="116" height="40" rx="8" fill="#faf5ff" stroke="#8250df" stroke-width="1"/>
    <text class="mv-node" x="190" y="180" text-anchor="middle" dominant-baseline="central" fill="#4c2889">VPN server</text>

    <rect x="146" y="242" width="88" height="36" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
    <text class="mv-node" x="190" y="260" text-anchor="middle" dominant-baseline="central" fill="#0a3069">server</text>

    <text class="mv-sub" x="190" y="304" text-anchor="middle">every packet goes through the middle</text>

    <line class="mv-divider" x1="380" y1="40" x2="380" y2="280"/>

    <text class="mv-title" x="410" y="44">mesh</text>

    <line class="mv-link" x1="480" y1="100" x2="660" y2="100"/>
    <line class="mv-link" x1="480" y1="260" x2="660" y2="260"/>
    <line class="mv-link" x1="480" y1="100" x2="480" y2="260"/>
    <line class="mv-link" x1="660" y1="100" x2="660" y2="260"/>
    <line class="mv-link" x1="480" y1="100" x2="660" y2="260"/>
    <line class="mv-link" x1="660" y1="100" x2="480" y2="260"/>

    <rect x="436" y="82" width="88" height="36" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
    <text class="mv-node" x="480" y="100" text-anchor="middle" dominant-baseline="central" fill="#0a3069">laptop</text>

    <rect x="616" y="82" width="88" height="36" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
    <text class="mv-node" x="660" y="100" text-anchor="middle" dominant-baseline="central" fill="#0a3069">phone</text>

    <rect x="436" y="242" width="88" height="36" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
    <text class="mv-node" x="480" y="260" text-anchor="middle" dominant-baseline="central" fill="#0a3069">server</text>

    <rect x="616" y="242" width="88" height="36" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
    <text class="mv-node" x="660" y="260" text-anchor="middle" dominant-baseline="central" fill="#0a3069">NAS</text>

    <text class="mv-sub" x="570" y="304" text-anchor="middle">a direct tunnel between any two devices</text>
  </g>
</svg>
