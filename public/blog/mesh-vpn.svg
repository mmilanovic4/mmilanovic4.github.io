<svg width="680" height="290" viewBox="0 0 680 290" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">

  <!-- White background -->
  <rect width="680" height="290" fill="#fff"/>

  <!-- Titles -->
  <text x="165" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Hub and spoke</text>
  <text x="515" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Mesh</text>

  <!-- LEFT: lines through the hub -->
  <line x1="78"  y1="82"  x2="165" y2="155" stroke="#111" stroke-width="1"/>
  <line x1="252" y1="82"  x2="165" y2="155" stroke="#111" stroke-width="1"/>
  <line x1="165" y1="238" x2="165" y2="155" stroke="#111" stroke-width="1"/>

  <!-- LEFT: hub -->
  <rect x="115" y="138" width="100" height="34" rx="4" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="165" y="159" text-anchor="middle" font-size="12" fill="#111">VPN server</text>

  <!-- LEFT: clients -->
  <rect x="40" y="65" width="76" height="34" rx="4" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="78" y="86" text-anchor="middle" font-size="12" fill="#111">Laptop</text>

  <rect x="214" y="65" width="76" height="34" rx="4" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="252" y="86" text-anchor="middle" font-size="12" fill="#111">Phone</text>

  <rect x="127" y="221" width="76" height="34" rx="4" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="165" y="242" text-anchor="middle" font-size="12" fill="#111">Server</text>

  <text x="165" y="278" text-anchor="middle" font-size="11" fill="#555">Every packet goes through the middle</text>

  <!-- RIGHT: every node to every node -->
  <line x1="430" y1="82"  x2="600" y2="82"  stroke="#111" stroke-width="1"/>
  <line x1="430" y1="238" x2="600" y2="238" stroke="#111" stroke-width="1"/>
  <line x1="430" y1="82"  x2="430" y2="238" stroke="#111" stroke-width="1"/>
  <line x1="600" y1="82"  x2="600" y2="238" stroke="#111" stroke-width="1"/>
  <line x1="430" y1="82"  x2="600" y2="238" stroke="#111" stroke-width="1"/>
  <line x1="600" y1="82"  x2="430" y2="238" stroke="#111" stroke-width="1"/>

  <!-- RIGHT: nodes -->
  <rect x="392" y="65" width="76" height="34" rx="4" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="430" y="86" text-anchor="middle" font-size="12" fill="#111">Laptop</text>

  <rect x="562" y="65" width="76" height="34" rx="4" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="600" y="86" text-anchor="middle" font-size="12" fill="#111">Phone</text>

  <rect x="392" y="221" width="76" height="34" rx="4" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="430" y="242" text-anchor="middle" font-size="12" fill="#111">Server</text>

  <rect x="562" y="221" width="76" height="34" rx="4" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="600" y="242" text-anchor="middle" font-size="12" fill="#111">NAS</text>

  <text x="515" y="278" text-anchor="middle" font-size="11" fill="#555">Direct connection between any two devices</text>
</svg>
