<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180" role="img" aria-label="Local forwarding opens a port on your machine; traffic sent to it travels through the SSH tunnel to the server, which connects to a database only it can reach">
  <style>
    .lf text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .lf-sub { font-size: 13px; fill: #57606a; }
    .lf-node-title { font-size: 13px; font-weight: 600; }
    .lf-node-sub { font-size: 12px; }
    .lf-label { font-size: 12px; fill: #57606a; }
    .lf-label-tunnel { font-size: 12px; fill: #1a7f37; }
    .lf text.lf-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .lf-edge { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .lf-edge-tunnel { stroke: #1a7f37; stroke-width: 1.5; fill: none; }
    .lf-tunnel { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1; }
  </style>

  <defs>
    <marker id="lf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="lf-arrow-tunnel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1a7f37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="180" fill="#ffffff"/>

  <g class="lf">
    <rect class="lf-tunnel" x="194" y="63" width="112" height="22"/>
    <line class="lf-edge-tunnel" x1="214" y1="74" x2="286" y2="74" marker-end="url(#lf-arrow-tunnel)"/>
    <text class="lf-label-tunnel" x="250" y="52" text-anchor="middle">SSH tunnel</text>
    <text class="lf-label" x="250" y="104" text-anchor="middle">you dial out</text>

    <rect x="30" y="30" width="170" height="88" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
    <text class="lf-node-title" x="115" y="54" text-anchor="middle" dominant-baseline="central" fill="#0a3069">your machine</text>
    <text class="lf-node-sub" x="115" y="75" text-anchor="middle" dominant-baseline="central" fill="#185fa5">port opens here</text>
    <text class="lf-mono" x="115" y="94" text-anchor="middle" dominant-baseline="central" fill="#185fa5">localhost:5432</text>

    <rect x="300" y="30" width="160" height="88" rx="8" fill="#faf5ff" stroke="#8250df" stroke-width="1"/>
    <text class="lf-node-title" x="380" y="54" text-anchor="middle" dominant-baseline="central" fill="#4c2889">bastion</text>
    <text class="lf-node-sub" x="380" y="75" text-anchor="middle" dominant-baseline="central" fill="#6639ba">SSH server that can</text>
    <text class="lf-node-sub" x="380" y="94" text-anchor="middle" dominant-baseline="central" fill="#6639ba">see the database</text>

    <text class="lf-label" x="510" y="60" text-anchor="middle">plain TCP</text>
    <line class="lf-edge" x1="462" y1="74" x2="558" y2="74" marker-end="url(#lf-arrow)"/>

    <rect x="560" y="30" width="170" height="88" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <text class="lf-mono" x="645" y="54" text-anchor="middle" dominant-baseline="central" fill="#24292f" font-weight="600">db.internal:5432</text>
    <text class="lf-node-sub" x="645" y="75" text-anchor="middle" dominant-baseline="central" fill="#57606a">private network,</text>
    <text class="lf-node-sub" x="645" y="94" text-anchor="middle" dominant-baseline="central" fill="#57606a">out of your reach</text>

    <text class="lf-sub" x="380" y="152" text-anchor="middle">you reach whatever the server can reach</text>
  </g>
</svg>
