<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" width="760" height="348" role="img" aria-label="With checkout only one branch is live in a single working directory; with worktree four directories share one .git and hold four branches at once">
  <style>
    .wt text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .wt-title { font-size: 17px; font-weight: 600; fill: #24292f; }
    .wt-sub { font-size: 13px; fill: #57606a; }
    .wt-node-title { font-size: 13px; font-weight: 600; }
    .wt-node-sub { font-size: 12px; }
    .wt-divider { stroke: #d0d7de; stroke-width: 1; }
    .wt-edge { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .wt-idle-box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 4 4; }
    .wt-idle-text { font-size: 13px; fill: #57606a; }
  </style>

  <defs>
    <marker id="wt-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="348" fill="#ffffff"/>

  <g class="wt">
    <text class="wt-title" x="30" y="44">checkout</text>

    <rect x="60" y="78" width="220" height="52" rx="8" fill="#faf5ff" stroke="#8250df" stroke-width="1"/>
    <text class="wt-node-title" x="170" y="98" text-anchor="middle" dominant-baseline="central" fill="#4c2889">app/</text>
    <text class="wt-node-sub" x="170" y="116" text-anchor="middle" dominant-baseline="central" fill="#6639ba">.git + working files</text>

    <line class="wt-edge" x1="170" y1="130" x2="170" y2="156" marker-end="url(#wt-arrow)"/>

    <rect x="60" y="162" width="220" height="30" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
    <text class="wt-node-title" x="170" y="177" text-anchor="middle" dominant-baseline="central" fill="#0a3069">main</text>

    <rect class="wt-idle-box" x="60" y="200" width="220" height="30" rx="8"/>
    <text class="wt-idle-text" x="170" y="215" text-anchor="middle" dominant-baseline="central">dev</text>

    <rect class="wt-idle-box" x="60" y="238" width="220" height="30" rx="8"/>
    <text class="wt-idle-text" x="170" y="253" text-anchor="middle" dominant-baseline="central">feature/x</text>

    <rect class="wt-idle-box" x="60" y="276" width="220" height="30" rx="8"/>
    <text class="wt-idle-text" x="170" y="291" text-anchor="middle" dominant-baseline="central">hotfix/y</text>

    <text class="wt-sub" x="170" y="330" text-anchor="middle">only one branch at a time</text>

    <line class="wt-divider" x1="380" y1="40" x2="380" y2="318"/>

    <text class="wt-title" x="410" y="44">worktree</text>

    <rect x="475" y="78" width="180" height="52" rx="8" fill="#faf5ff" stroke="#8250df" stroke-width="1"/>
    <text class="wt-node-title" x="565" y="98" text-anchor="middle" dominant-baseline="central" fill="#4c2889">app/.git</text>
    <text class="wt-node-sub" x="565" y="116" text-anchor="middle" dominant-baseline="central" fill="#6639ba">shared object store</text>

    <path class="wt-edge" d="M565,130 C565,164 448,160 448,191"/>
    <path class="wt-edge" d="M565,130 C565,164 532,160 532,191"/>
    <path class="wt-edge" d="M565,130 C565,164 616,160 616,191"/>
    <path class="wt-edge" d="M565,130 C565,164 700,160 700,191"/>

    <rect x="410" y="193" width="76" height="58" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
    <text class="wt-node-title" x="448" y="214" text-anchor="middle" dominant-baseline="central" fill="#0a3069">main</text>
    <text class="wt-node-sub" x="448" y="233" text-anchor="middle" dominant-baseline="central" fill="#185fa5">main</text>

    <rect x="494" y="193" width="76" height="58" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
    <text class="wt-node-title" x="532" y="214" text-anchor="middle" dominant-baseline="central" fill="#0a3069">dev</text>
    <text class="wt-node-sub" x="532" y="233" text-anchor="middle" dominant-baseline="central" fill="#185fa5">dev</text>

    <rect x="578" y="193" width="76" height="58" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
    <text class="wt-node-title" x="616" y="214" text-anchor="middle" dominant-baseline="central" fill="#0a3069">feature-x</text>
    <text class="wt-node-sub" x="616" y="233" text-anchor="middle" dominant-baseline="central" fill="#185fa5">feature/x</text>

    <rect x="662" y="193" width="76" height="58" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
    <text class="wt-node-title" x="700" y="214" text-anchor="middle" dominant-baseline="central" fill="#0a3069">hotfix-y</text>
    <text class="wt-node-sub" x="700" y="233" text-anchor="middle" dominant-baseline="central" fill="#185fa5">hotfix/y</text>

    <text class="wt-sub" x="574" y="330" text-anchor="middle">all four checked out on disk</text>
  </g>
</svg>