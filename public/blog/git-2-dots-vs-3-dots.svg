<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Two dots lists only the commits on dev that are not on main, three dots lists both sides and marks each one" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .rng text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .rng text.rng-title { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 17px; font-weight: 600; fill: #24292f; }
    .rng-sub { font-size: 13px; fill: #57606a; }
    .rng-branch { font-size: 13px; fill: #57606a; }
    .rng-branch-dev { font-size: 13px; fill: #bf3989; }
    .rng-edge { stroke: #8c959f; stroke-width: 2; fill: none; }
    .rng-divider { stroke: #d0d7de; stroke-width: 1; }
    .rng-n-main { fill: #0969da; }
    .rng-n-dev { fill: #bf3989; }
    .rng-n-out { fill: #ffffff; stroke: #d0d7de; stroke-width: 2; }
    .rng-halo-main { fill: #0969da; opacity: 0.14; }
    .rng-halo-dev { fill: #bf3989; opacity: 0.14; }
    .rng-mark { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
  </style>

  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>

  <g class="rng">
    <text class="rng-title" x="30" y="44">main..dev</text>
    <text class="rng-sub" x="30" y="66">on dev, not on main</text>

    <path class="rng-edge" d="M60,210 H270"/>
    <path class="rng-edge" d="M60,210 C95,210 95,130 130,130"/>
    <path class="rng-edge" d="M130,130 H270"/>

    <circle class="rng-n-out" cx="60" cy="210" r="8"/>
    <circle class="rng-n-out" cx="130" cy="210" r="8"/>
    <circle class="rng-n-out" cx="200" cy="210" r="8"/>
    <circle class="rng-n-out" cx="270" cy="210" r="8"/>

    <circle class="rng-halo-dev" cx="130" cy="130" r="13"/>
    <circle class="rng-halo-dev" cx="200" cy="130" r="13"/>
    <circle class="rng-halo-dev" cx="270" cy="130" r="13"/>
    <circle class="rng-n-dev" cx="130" cy="130" r="8"/>
    <circle class="rng-n-dev" cx="200" cy="130" r="8"/>
    <circle class="rng-n-dev" cx="270" cy="130" r="8"/>

    <text class="rng-branch-dev" x="290" y="130" dominant-baseline="central">dev</text>
    <text class="rng-branch" x="290" y="210" dominant-baseline="central">main</text>

    <line class="rng-divider" x1="380" y1="40" x2="380" y2="262"/>

    <text class="rng-title" x="410" y="44">main...dev</text>
    <text class="rng-sub" x="410" y="66">on either side, but not on both</text>

    <path class="rng-edge" d="M440,210 H650"/>
    <path class="rng-edge" d="M440,210 C475,210 475,130 510,130"/>
    <path class="rng-edge" d="M510,130 H650"/>

    <circle class="rng-n-out" cx="440" cy="210" r="8"/>

    <circle class="rng-halo-main" cx="510" cy="210" r="13"/>
    <circle class="rng-halo-main" cx="580" cy="210" r="13"/>
    <circle class="rng-halo-main" cx="650" cy="210" r="13"/>
    <circle class="rng-n-main" cx="510" cy="210" r="8"/>
    <circle class="rng-n-main" cx="580" cy="210" r="8"/>
    <circle class="rng-n-main" cx="650" cy="210" r="8"/>

    <circle class="rng-halo-dev" cx="510" cy="130" r="13"/>
    <circle class="rng-halo-dev" cx="580" cy="130" r="13"/>
    <circle class="rng-halo-dev" cx="650" cy="130" r="13"/>
    <circle class="rng-n-dev" cx="510" cy="130" r="8"/>
    <circle class="rng-n-dev" cx="580" cy="130" r="8"/>
    <circle class="rng-n-dev" cx="650" cy="130" r="8"/>

    <text class="rng-mark" x="510" y="108" text-anchor="middle" fill="#bf3989">&gt;</text>
    <text class="rng-mark" x="580" y="108" text-anchor="middle" fill="#bf3989">&gt;</text>
    <text class="rng-mark" x="650" y="108" text-anchor="middle" fill="#bf3989">&gt;</text>

    <text class="rng-mark" x="510" y="240" text-anchor="middle" fill="#0969da">&lt;</text>
    <text class="rng-mark" x="580" y="240" text-anchor="middle" fill="#0969da">&lt;</text>
    <text class="rng-mark" x="650" y="240" text-anchor="middle" fill="#0969da">&lt;</text>

    <text class="rng-branch-dev" x="670" y="130" dominant-baseline="central">dev</text>
    <text class="rng-branch" x="670" y="210" dominant-baseline="central">main</text>
  </g>
</svg>