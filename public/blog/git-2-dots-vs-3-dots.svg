<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" width="760" height="278" role="img" aria-label="Two dots lists only the commits on dev that are not on main, three dots lists both sides and marks each one">
  <style>
    .rng text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .rng text.rng-title { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 17px; font-weight: 600; fill: #24292f; }
    .rng-branch { font-size: 13px; fill: #57606a; }
    .rng-branch-dev { font-size: 13px; fill: #bf3989; }
    .rng-edge { stroke: #8c959f; stroke-width: 2; fill: none; }
    .rng-divider { stroke: #d0d7de; stroke-width: 1; }
    .rng-n-main { fill: #0969da; }
    .rng-n-dev { fill: #bf3989; }
    .rng-n-out { fill: #ffffff; stroke: #d0d7de; stroke-width: 2; }
    .rng-halo-main { fill: #0969da; opacity: 0.14; }
    .rng-halo-dev { fill: #bf3989; opacity: 0.14; }
    .rng-mark { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
  </style>

  <rect x="0" y="0" width="760" height="278" fill="#ffffff"/>

  <g class="rng">
    <text class="rng-title" x="30" y="44">main..dev</text>

    <path class="rng-edge" d="M60,188 H270"/>
    <path class="rng-edge" d="M60,188 C95,188 95,108 130,108"/>
    <path class="rng-edge" d="M130,108 H270"/>

    <circle class="rng-n-out" cx="60" cy="188" r="8"/>
    <circle class="rng-n-out" cx="130" cy="188" r="8"/>
    <circle class="rng-n-out" cx="200" cy="188" r="8"/>
    <circle class="rng-n-out" cx="270" cy="188" r="8"/>

    <circle class="rng-halo-dev" cx="130" cy="108" r="13"/>
    <circle class="rng-halo-dev" cx="200" cy="108" r="13"/>
    <circle class="rng-halo-dev" cx="270" cy="108" r="13"/>
    <circle class="rng-n-dev" cx="130" cy="108" r="8"/>
    <circle class="rng-n-dev" cx="200" cy="108" r="8"/>
    <circle class="rng-n-dev" cx="270" cy="108" r="8"/>

    <text class="rng-branch-dev" x="290" y="108" dominant-baseline="central">dev</text>
    <text class="rng-branch" x="290" y="188" dominant-baseline="central">main</text>

    <line class="rng-divider" x1="380" y1="40" x2="380" y2="240"/>

    <text class="rng-title" x="410" y="44">main...dev</text>

    <path class="rng-edge" d="M440,188 H650"/>
    <path class="rng-edge" d="M440,188 C475,188 475,108 510,108"/>
    <path class="rng-edge" d="M510,108 H650"/>

    <circle class="rng-n-out" cx="440" cy="188" r="8"/>

    <circle class="rng-halo-main" cx="510" cy="188" r="13"/>
    <circle class="rng-halo-main" cx="580" cy="188" r="13"/>
    <circle class="rng-halo-main" cx="650" cy="188" r="13"/>
    <circle class="rng-n-main" cx="510" cy="188" r="8"/>
    <circle class="rng-n-main" cx="580" cy="188" r="8"/>
    <circle class="rng-n-main" cx="650" cy="188" r="8"/>

    <circle class="rng-halo-dev" cx="510" cy="108" r="13"/>
    <circle class="rng-halo-dev" cx="580" cy="108" r="13"/>
    <circle class="rng-halo-dev" cx="650" cy="108" r="13"/>
    <circle class="rng-n-dev" cx="510" cy="108" r="8"/>
    <circle class="rng-n-dev" cx="580" cy="108" r="8"/>
    <circle class="rng-n-dev" cx="650" cy="108" r="8"/>

    <text class="rng-mark" x="510" y="86" text-anchor="middle" fill="#bf3989">&gt;</text>
    <text class="rng-mark" x="580" y="86" text-anchor="middle" fill="#bf3989">&gt;</text>
    <text class="rng-mark" x="650" y="86" text-anchor="middle" fill="#bf3989">&gt;</text>

    <text class="rng-mark" x="510" y="218" text-anchor="middle" fill="#0969da">&lt;</text>
    <text class="rng-mark" x="580" y="218" text-anchor="middle" fill="#0969da">&lt;</text>
    <text class="rng-mark" x="650" y="218" text-anchor="middle" fill="#0969da">&lt;</text>

    <text class="rng-branch-dev" x="670" y="108" dominant-baseline="central">dev</text>
    <text class="rng-branch" x="670" y="188" dominant-baseline="central">main</text>
  </g>
</svg>