<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="A browser requests a file over HTTP and the server returns a static HTML document that the browser renders">
  <style>
    .dm text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dm-title { font-size: 17px; font-weight: 600; fill: #24292f; }
    .dm-sub { font-size: 13px; fill: #57606a; }
    .dm-node-title { font-size: 13px; font-weight: 600; }
    .dm-node-sub { font-size: 12px; }
    .dm-label { font-size: 12px; fill: #57606a; }
    .dm-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #57606a; }
    .dm-edge { stroke: #8c959f; stroke-width: 1.5; fill: none; }
  </style>

  <defs>
    <marker id="dm-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="240" fill="#ffffff"/>

  <g class="dm">
    <text class="dm-title" x="30" y="44">the document model</text>
    <text class="dm-sub" x="30" y="66">a file on a server, rendered by a browser</text>

    <rect x="110" y="110" width="200" height="72" rx="8" fill="#faf5ff" stroke="#8250df" stroke-width="1"/>
    <text class="dm-node-title" x="210" y="136" text-anchor="middle" dominant-baseline="central" fill="#4c2889">server</text>
    <text class="dm-node-sub" x="210" y="158" text-anchor="middle" dominant-baseline="central" fill="#6639ba">a .html file on disk</text>

    <text class="dm-mono" x="380" y="120" text-anchor="middle">GET /index.html</text>
    <line class="dm-edge" x1="450" y1="130" x2="312" y2="130" marker-end="url(#dm-arrow)"/>

    <text class="dm-label" x="380" y="152" text-anchor="middle">the file, as it is</text>
    <line class="dm-edge" x1="310" y1="162" x2="448" y2="162" marker-end="url(#dm-arrow)"/>

    <rect x="450" y="110" width="200" height="72" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
    <text class="dm-node-title" x="550" y="136" text-anchor="middle" dominant-baseline="central" fill="#0a3069">browser</text>
    <text class="dm-node-sub" x="550" y="158" text-anchor="middle" dominant-baseline="central" fill="#185fa5">renders HTML + CSS</text>

    <text class="dm-sub" x="380" y="212" text-anchor="middle">no build step — you upload the file and it works</text>
  </g>
</svg>
