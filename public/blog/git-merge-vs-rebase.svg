<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" width="760" height="278" role="img" aria-label="Merge keeps the fork in history, rebase replays the commits into a straight line">
  <style>
    .rvm text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .rvm-title { font-size: 17px; font-weight: 600; fill: #24292f; }
    .rvm-sub { font-size: 13px; fill: #57606a; }
    .rvm-branch { font-size: 13px; fill: #57606a; }
    .rvm-branch-feat { font-size: 13px; fill: #bf3989; }
    .rvm-edge { stroke: #8c959f; stroke-width: 2; fill: none; }
    .rvm-ghost { stroke: #bf3989; stroke-width: 2; fill: none; stroke-dasharray: 4 4; opacity: 0.45; }
    .rvm-ghost-node { stroke-dasharray: 3 3; }
    .rvm-move { stroke: #8c959f; stroke-width: 2; fill: none; stroke-dasharray: 4 4; opacity: 0.6; }
    .rvm-arrow { fill: #8c959f; opacity: 0.6; stroke: none; }
    .rvm-divider { stroke: #d0d7de; stroke-width: 1; }
    .rvm-n-main { fill: #0969da; }
    .rvm-n-feat { fill: #bf3989; }
    .rvm-n-merge { fill: #8250df; }
  </style>

  <rect x="0" y="0" width="760" height="278" fill="#ffffff"/>

  <g class="rvm">
    <text class="rvm-title" x="30" y="44">merge</text>

    <path class="rvm-edge" d="M40,188 H300"/>
    <path class="rvm-edge" d="M100,188 C130,188 130,108 160,108"/>
    <path class="rvm-edge" d="M160,108 H220"/>
    <path class="rvm-edge" d="M220,108 C260,108 260,188 300,188"/>

    <circle class="rvm-n-main" cx="40" cy="188" r="8"/>
    <circle class="rvm-n-main" cx="100" cy="188" r="8"/>
    <circle class="rvm-n-main" cx="160" cy="188" r="8"/>
    <circle class="rvm-n-main" cx="220" cy="188" r="8"/>
    <circle class="rvm-n-merge" cx="300" cy="188" r="9"/>

    <circle class="rvm-n-feat" cx="160" cy="108" r="8"/>
    <circle class="rvm-n-feat" cx="220" cy="108" r="8"/>

    <text class="rvm-branch-feat" x="152" y="86">feature</text>
    <text class="rvm-branch" x="32" y="224">main</text>
    <text class="rvm-sub" x="300" y="224" text-anchor="middle">merge commit</text>

    <line class="rvm-divider" x1="380" y1="40" x2="380" y2="240"/>

    <text class="rvm-title" x="430" y="44">rebase</text>

    <path class="rvm-ghost" d="M485,188 C515,188 515,108 540,108"/>
    <path class="rvm-ghost" d="M540,108 H595"/>
    <circle class="rvm-ghost rvm-ghost-node" cx="540" cy="108" r="8"/>
    <circle class="rvm-ghost rvm-ghost-node" cx="595" cy="108" r="8"/>

    <path class="rvm-move" d="M615,126 C650,144 652,150 664,161"/>
    <path class="rvm-arrow" d="M670,168 L660.8,163.8 L667.8,158.2 Z"/>

    <path class="rvm-edge" d="M430,188 H705"/>

    <circle class="rvm-n-main" cx="430" cy="188" r="8"/>
    <circle class="rvm-n-main" cx="485" cy="188" r="8"/>
    <circle class="rvm-n-main" cx="540" cy="188" r="8"/>
    <circle class="rvm-n-main" cx="595" cy="188" r="8"/>
    <circle class="rvm-n-feat" cx="650" cy="188" r="8"/>
    <circle class="rvm-n-feat" cx="705" cy="188" r="8"/>

    <text class="rvm-branch" x="422" y="224">main</text>
    <text class="rvm-branch-feat" x="705" y="224" text-anchor="middle">feature</text>
  </g>
</svg>