<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="The server queries a database and builds the HTML on every request, while Ajax lets the browser ask for partial updates without a reload">
  <style>
    .ph text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ph-title { font-size: 17px; font-weight: 600; fill: #24292f; }
    .ph-sub { font-size: 13px; fill: #57606a; }
    .ph-node-title { font-size: 13px; font-weight: 600; }
    .ph-node-sub { font-size: 12px; }
    .ph-label { font-size: 12px; fill: #57606a; }
    .ph-edge { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .ph-edge-dash { stroke: #8c959f; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
  </style>

  <defs>
    <marker id="ph-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="260" fill="#ffffff"/>

  <g class="ph">
    <text class="ph-title" x="30" y="44">the PHP decade</text>
    <text class="ph-sub" x="30" y="66">the server builds the page before the browser sees a byte</text>

    <rect x="30" y="122" width="140" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <text class="ph-node-title" x="100" y="144" text-anchor="middle" dominant-baseline="central" fill="#24292f">database</text>
    <text class="ph-node-sub" x="100" y="164" text-anchor="middle" dominant-baseline="central" fill="#57606a">user data</text>

    <text class="ph-label" x="210" y="140" text-anchor="middle">query</text>
    <line class="ph-edge" x1="172" y1="154" x2="248" y2="154" marker-end="url(#ph-arrow)"/>

    <rect x="250" y="110" width="200" height="88" rx="8" fill="#faf5ff" stroke="#8250df" stroke-width="1"/>
    <text class="ph-node-title" x="350" y="134" text-anchor="middle" dominant-baseline="central" fill="#4c2889">server (PHP)</text>
    <text class="ph-node-sub" x="350" y="155" text-anchor="middle" dominant-baseline="central" fill="#6639ba">builds the HTML on the fly,</text>
    <text class="ph-node-sub" x="350" y="174" text-anchor="middle" dominant-baseline="central" fill="#6639ba">one request at a time</text>

    <text class="ph-label" x="490" y="124" text-anchor="middle">full page</text>
    <line class="ph-edge" x1="452" y1="138" x2="528" y2="138" marker-end="url(#ph-arrow)"/>

    <line class="ph-edge-dash" x1="530" y1="172" x2="454" y2="172" marker-end="url(#ph-arrow)"/>
    <text class="ph-label" x="490" y="190" text-anchor="middle">Ajax</text>

    <rect x="530" y="110" width="200" height="88" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
    <text class="ph-node-title" x="630" y="134" text-anchor="middle" dominant-baseline="central" fill="#0a3069">browser</text>
    <text class="ph-node-sub" x="630" y="155" text-anchor="middle" dominant-baseline="central" fill="#185fa5">renders the whole page,</text>
    <text class="ph-node-sub" x="630" y="174" text-anchor="middle" dominant-baseline="central" fill="#185fa5">or patches a piece of it</text>

    <text class="ph-sub" x="380" y="232" text-anchor="middle">Ajax was the moment the reload stopped being mandatory</text>
  </g>
</svg>
