<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 275" width="760" height="275" role="img" aria-label="Confidence plotted against competence: it spikes to a peak while competence is still near zero, collapses into a valley, then climbs slowly to a plateau below that first peak">
  <style>
    .dk text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dk-note { font-size: 12px; fill: #57606a; }
    .dk-axis-name { font-size: 12px; fill: #57606a; }
    .dk-axis-end { font-size: 11px; fill: #8c959f; }
    .dk-axis { stroke: #d0d7de; stroke-width: 1; }
    .dk-curve { fill: none; stroke-width: 2; stroke-linecap: round; }
    .dk-early { stroke: #bf3989; }
    .dk-late { stroke: #0969da; }
    .dk-halo-early { fill: #bf3989; opacity: 0.14; }
    .dk-halo-late { fill: #0969da; opacity: 0.14; }
    .dk-n-early { fill: #bf3989; }
    .dk-n-late { fill: #0969da; }
    .dk-n-out { fill: #ffffff; stroke: #d0d7de; stroke-width: 2; }
  </style>

  <rect x="0" y="0" width="760" height="275" fill="#ffffff"/>

  <g class="dk">
    <line class="dk-axis" x1="90" y1="30" x2="90" y2="227"/>
    <line class="dk-axis" x1="90" y1="227" x2="728" y2="227"/>

    <text class="dk-axis-end" x="78" y="35" text-anchor="end">high</text>
    <text class="dk-axis-end" x="78" y="223" text-anchor="end">low</text>
    <text class="dk-axis-name" x="42" y="128" text-anchor="middle" transform="rotate(-90 42 128)">confidence</text>

    <text class="dk-axis-end" x="90" y="249">knows nothing</text>
    <text class="dk-axis-name" x="409" y="249" text-anchor="middle">competence</text>
    <text class="dk-axis-end" x="728" y="249" text-anchor="end">expert</text>

    <path class="dk-curve dk-early" d="M96,223 C114,221 137,65 168,61 C188,58 214,189 300,189"/>
    <path class="dk-curve dk-late" d="M300,189 C368,189 620,63 700,63"/>

    <circle class="dk-halo-early" cx="168" cy="61" r="11"/>
    <circle class="dk-n-early" cx="168" cy="61" r="5"/>

    <circle class="dk-n-out" cx="300" cy="189" r="5"/>

    <circle class="dk-halo-late" cx="700" cy="63" r="11"/>
    <circle class="dk-n-late" cx="700" cy="63" r="5"/>

    <text class="dk-note" x="186" y="51">peak of Mount Stupid</text>
    <text class="dk-note" x="300" y="213" text-anchor="middle">valley of despair</text>
    <text class="dk-note" x="505" y="167">slope of enlightenment</text>
    <text class="dk-note" x="720" y="47" text-anchor="end">plateau of sustainability</text>
  </g>
</svg>
